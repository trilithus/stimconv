name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  # tools/release builds with -trimpath, which changes Go's build cache keys;
  # using it everywhere lets the package jobs reuse what vet/test compiled
  GOFLAGS: -trimpath

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Fyne build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc pkg-config libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev
      - run: go vet ./...
      - run: go test ./...

  package:
    needs: test
    # Fyne needs cgo, so every package is built natively on its platform
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false # one broken platform shouldn't hide the others
      matrix:
        include:
          - { os: windows, arch: amd64, name: windows-x64, runner: windows-latest }
          - { os: windows, arch: arm64, name: windows-arm64, runner: windows-11-arm }
          - { os: linux, arch: amd64, name: linux-x64, runner: ubuntu-latest }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe needs tags
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Fyne build dependencies
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y gcc pkg-config libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev
      - name: C compiler (llvm-mingw for Arm64)
        if: matrix.arch == 'arm64' && matrix.os == 'windows'
        run: |
          curl -sSL -o llvm-mingw.zip https://github.com/mstorsjo/llvm-mingw/releases/download/20260922/llvm-mingw-20260922-ucrt-aarch64.zip
          unzip -q llvm-mingw.zip -d "$RUNNER_TEMP"
          echo "$(ls -d "$RUNNER_TEMP"/llvm-mingw-*/bin | head -1)" >> "$GITHUB_PATH"
      - uses: actions/cache@v6
        if: matrix.os == 'windows'
        with:
          path: .cache/ffmpeg
          key: ffmpeg-${{ matrix.arch }}-${{ hashFiles('ffmpeg*.json') }}
      - name: Build package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then export STIMCONV_VERSION="$GITHUB_REF_NAME"; fi
          go run ./tools/release -os ${{ matrix.os }} -arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: stimconv-${{ matrix.name }}
          path: dist/stimconv-*.*
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
