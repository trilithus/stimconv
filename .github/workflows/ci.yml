name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  package:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { os: windows, arch: amd64, name: windows-x64 }
          - { os: windows, arch: arm64, name: windows-arm64 }
          - { os: linux, arch: amd64, name: linux-x64 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs tags
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        if: matrix.os == 'windows'
        with:
          path: .cache/ffmpeg
          key: ffmpeg-${{ matrix.arch }}-${{ hashFiles('ffmpeg*.json') }}
      - name: Build package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then export STIMCONV_VERSION="$GITHUB_REF_NAME"; fi
          go run ./tools/release -os ${{ matrix.os }} -arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: stimconv-${{ matrix.name }}
          path: dist/stimconv-*.*
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
